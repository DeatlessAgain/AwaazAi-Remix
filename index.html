<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Remix Awaaz AI V1 - Realistic Voice Generator</title>
    <meta name="description" content="Generate ultra-realistic human voices for Urdu, English, and Hindi text with instant high-quality audio downloads." />
    <meta property="og:title" content="Remix Awaaz AI V1 - Realistic Voice Generator" />
    <meta property="og:description" content="Generate ultra-realistic human voices for Urdu, English, and Hindi text with instant high-quality audio downloads." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Android PWA & Mobile Standalone App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Awaaz AI" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Self-healing: Unregister any obsolete service workers and clear poisoned caches -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) {
              reg.unregister().catch(function() {});
            });
          }).catch(function() {});
        }
        if (typeof caches !== 'undefined') {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              if (key.indexOf('awaaz-ai-pwa') !== -1) {
                caches.delete(key).catch(function() {});
              }
            });
          }).catch(function() {});
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050507] text-[#e0e0e0] antialiased min-h-screen selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script>
      // Only register service worker in standalone / top-level window, not inside iframe previews
      if ('serviceWorker' in navigator && window.self === window.top) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
