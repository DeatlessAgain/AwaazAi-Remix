name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          cd android-native-project
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwaazAI-Studio-Debug-APK
          path: android-native-project/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AwaazAI-All-APKs
          path: |
            android-native-project/app/build/outputs/apk/**/*.apk
            APK_DOWNLOAD/*.apk
          if-no-files-found: ignore
          retention-days: 30
