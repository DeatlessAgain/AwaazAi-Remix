name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies & Build Full Studio
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android-native-project/app/src/main/assets
          cp -r dist/* android-native-project/app/src/main/assets/
          rm -f android-native-project/app/src/main/assets/*.apk android-native-project/app/src/main/assets/*.zip android-native-project/app/src/main/assets/server.cjs*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Official Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Android APK
        run: |
          export PATH="$GITHUB_WORKSPACE/gradle-8.5/bin:$PATH"
          gradle -v
          if [ -f "android-native-project/settings.gradle.kts" ]; then
            cd android-native-project
            gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwaazAI-Studio-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            android-native-project/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AwaazAI-All-APKs
          path: |
            android-native-project/app/build/outputs/apk/**/*.apk
            APK_DOWNLOAD/*.apk
          if-no-files-found: ignore
          retention-days: 30
