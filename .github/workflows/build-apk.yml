name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Build Full Studio
        run: |
          npm install
          npm run build
          mkdir -p android-native-project/app/src/main/assets
          cp -r dist/* android-native-project/app/src/main/assets/
          rm -f android-native-project/app/src/main/assets/*.apk android-native-project/app/src/main/assets/*.zip android-native-project/app/src/main/assets/server.cjs*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Official Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Configure Global Gradle Properties & AndroidX
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cp ~/.gradle/gradle.properties android-native-project/gradle.properties || true
          cp ~/.gradle/gradle.properties ./gradle.properties || true

      - name: Build Android APK (Clean & Assemble with AndroidX Flags)
        run: |
          export PATH="$GITHUB_WORKSPACE/gradle-8.5/bin:$PATH"
          gradle -v
          if [ -f "android-native-project/settings.gradle.kts" ]; then
            cd android-native-project
          fi
          # Clean build first to eliminate stale cache
          gradle clean --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true -Dandroid.useAndroidX=true -Dandroid.enableJetifier=true
          # Assemble debug with explicit AndroidX properties
          gradle assembleDebug --no-daemon --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            -Dandroid.useAndroidX=true \
            -Dandroid.enableJetifier=true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwaazAI-Studio-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            android-native-project/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AwaazAI-All-APKs
          path: |
            android-native-project/app/build/outputs/apk/**/*.apk
            APK_DOWNLOAD/*.apk
          if-no-files-found: ignore
          retention-days: 30
