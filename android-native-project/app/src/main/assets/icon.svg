<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Glowing Waveform & AI Aura -->
  <g filter="url(#glow)">
    <!-- Waveform Bars -->
    <rect x="110" y="216" width="28" height="80" rx="14" fill="url(#primaryGrad)"/>
    <rect x="160" y="160" width="28" height="192" rx="14" fill="url(#primaryGrad)"/>
    <rect x="210" y="110" width="28" height="292" rx="14" fill="url(#primaryGrad)"/>
    <rect x="260" y="80" width="28" height="352" rx="14" fill="url(#primaryGrad)"/>
    <rect x="310" y="130" width="28" height="252" rx="14" fill="url(#primaryGrad)"/>
    <rect x="360" y="180" width="28" height="152" rx="14" fill="url(#primaryGrad)"/>
    <rect x="410" y="226" width="28" height="60" rx="14" fill="url(#primaryGrad)"/>
    
    <!-- AI Sparkle Core -->
    <circle cx="274" cy="120" r="16" fill="#fef08a" opacity="0.9"/>
  </g>
</svg>
